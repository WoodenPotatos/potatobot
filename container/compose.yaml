# PotatoBot as two supervised services sharing one PostgreSQL (2.21).
#
# Splitting them means a dashboard restart never interrupts the bot, and a
# dashboard crash cannot take Discord connectivity with it. They coordinate
# entirely through the database: feature changes converge by revision polling,
# queued Discord publishes travel through the control_actions outbox, which only
# the bot executes, and every write takes one advisory lock, so the two
# processes serialize exactly as one would.
#
# Invoke from the repository root:
#   podman-compose -f container/compose.yaml up -d      (or: docker compose -f container/compose.yaml up -d)
#
# Copy .env.example to ../.env and fill in real values first -- both services
# declare env_file: ../.env below and neither starts without it; its PGPASSWORD
# is the bot role's. Then create ../.env.postgres with POSTGRES_PASSWORD (the
# database superuser's) and POTATOBOT_DB_PASSWORD (the same value as
# PGPASSWORD); only the `db` service reads it, so the bot never holds the
# superuser's password. Set a real POTATOBOT_DASHBOARD_SESSION_SECRET in .env
# too: without one, the dashboard generates a file in the data directory on the
# /data volume, which survives a recreate but is one more secret living with
# the data rather than the config.
#
# The bot brings the schema up to date itself when it starts, after a pg_dump
# whenever a migration is pending; `update_db.py` does the same as one step:
#   podman-compose -f container/compose.yaml run --rm bot python update_db.py
#
# The weekly Everydle drift check has no service here -- it is one-shot and
# read-only, so a host-level cron/systemd-timer entry running this on the
# same schedule the bare-metal deployment uses (deploy/potatobot-everydle-drift.timer)
# is simpler than a sidecar container for it:
#   podman-compose -f container/compose.yaml run --rm bot python scripts/everydle_drift.py

name: potatobot

# The container-native subset of deploy/potatobot.service's ~20 systemd
# sandboxing directives -- compose cannot express most of them (there is no
# equivalent of SystemCallFilter or ProtectKernelTunables), but these are
# real and the process already needs no more than this bare-metal. The umask
# is the image's own entrypoint, since compose has no key for it.
x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - "ALL"
  # Every write goes to /data; /tmp is a tmpfs because docker, unlike podman,
  # adds none on its own. Trialled 2026-10-30 (deploy/potatobot.container).
  read_only: true
  tmpfs:
    - /tmp

services:
  db:
    # The server CI tests against, pinned by digest; bump both together.
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: unless-stopped
    env_file: ../.env.postgres
    environment:
      # Code-point text order, as SQLite had and the suite's server has.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once on an empty data directory: the bot's own, non-superuser role.
      - ../deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    # No ports: only the bot and the dashboard, on this project's network, reach it.
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    # Docker gives a read-only container no tmpfs; PostgreSQL's socket and /tmp.
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      # Over TCP: during initialisation the image's temporary server listens on
      # its socket only, and a socket probe called that healthy.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "potatobot", "-d", "potatobot"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    stop_grace_period: 90s

  bot:
    <<: *hardening
    build:
      context: ..
      dockerfile: container/Containerfile
    image: potatobot:2.21.34a
    restart: unless-stopped
    env_file: ../.env
    environment:
      PGHOST: db
      PGDATABASE: potatobot
      PGUSER: potatobot
      # Where a 2.20 SQLite file would sit, for the copy script.
      POTATOBOT_DB_PATH: /data/economy.db
      POTATOBOT_DATA_DIR: /data
      POTATOBOT_LOG_DIR: /data/logs
      POTATOBOT_EVERYDLE_STATE_PATH: /data/everydle_state.json
      # The bot owns schema creation, so it must not also serve the dashboard.
      POTATOBOT_DASHBOARD_ENABLED: "false"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

  dashboard:
    <<: *hardening
    build:
      context: ..
      dockerfile: container/Containerfile
    image: potatobot:2.21.34a
    command: ["python", "dashboard_api.py"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      PGHOST: db
      PGDATABASE: potatobot
      PGUSER: potatobot
      POTATOBOT_DATA_DIR: /data
      POTATOBOT_LOG_DIR: /data/logs
      POTATOBOT_DASHBOARD_ENABLED: "true"
      POTATOBOT_DASHBOARD_HOST: 0.0.0.0
      POTATOBOT_DASHBOARD_PORT: "5000"
      # One reverse proxy in front, so exactly one forwarded hop is trusted.
      # Also what permits the 0.0.0.0 bind above once an external URL is set:
      # `core/deployment.py` refuses a non-loopback bind unless the proxy
      # topology has been stated, and this is the statement.
      POTATOBOT_TRUSTED_PROXY_HOPS: "1"
    volumes:
      - data:/data
    ports:
      # Loopback only. Terminate HTTPS with a Cloudflare Tunnel, Tailscale Serve or nginx in front;
      # never publish this port to an untrusted network.
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started

volumes:
  data:
  pgdata:
