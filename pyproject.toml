[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "potatobot"
version = "2.3.0b1"
description = "A Hungarian-first Discord community bot and control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
dependencies = [
  "aiohttp==3.14.3",
  "discord.py==2.7.1",
  "defusedxml==0.7.1",
  "Flask==3.1.3",
  "PyNaCl==1.6.2",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "waitress==3.0.2",
  "yt-dlp==2026.7.4",
]

[tool.setuptools]
py-modules = [
  "bounded", "dashboard_api", "database", "deployment", "feature_access",
  "item_catalog", "main", "minigame_data", "permission_audit",
  "settings_registry", "update_db", "version",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
