[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "potatobot"
version = "2.14.0b2"
description = "A Hungarian-first Discord community bot and control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
dependencies = [
  "aiohttp==3.14.3",
  "discord.py==2.7.1",
  "defusedxml==0.7.1",
  "Flask==3.1.3",
  "PyNaCl==1.6.2",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "waitress==3.0.2",
  "yt-dlp==2026.8.19",
]

[tool.setuptools]
# The three entry points are modules at the root because that is how they are
# run -- the systemd units and the Containerfile name them by filename. The
# shared modules they import are the `core` package.
py-modules = ["main", "dashboard_api", "update_db"]
packages = ["core"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
