[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "potatobot"
version = "2.15.0b1"
description = "A Hungarian-first Discord community bot and control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
dependencies = [
  "aiohttp==3.14.3",
  "discord.py==2.7.1",
  "defusedxml==0.7.1",
  "Flask==3.1.3",
  "PyNaCl==1.6.2",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "waitress==3.0.2",
  "yt-dlp==2026.8.19",
]

[tool.setuptools]
# The three entry points are modules at the root because that is how they are
# run -- the systemd units and the Containerfile name them by filename. The
# shared modules they import are the `core` package.
py-modules = ["main", "dashboard_api", "update_db"]
packages = ["core"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]

[tool.mypy]
# Scoped to core/ only, deliberately: cogs/ trades in discord.py's own
# object-union types (`interaction.channel`, `member.guild`, ...), whose
# stubs are broad enough that checking it produces noise dominated by
# discord.py's own typing model rather than real findings -- confirmed by
# actually running it there before scoping this down, not assumed. core/ is
# this project's own data layer and is where a wrong type has actually
# reached production before (docs/lessons.md; the clock and snowflake-wire
# rules in CLAUDE.md both trace back to exactly this class of bug).
files = ["core"]
python_version = "3.12"
ignore_missing_imports = true
# core/ imports cogs.utils for one late import (see settings_cache.py); this
# keeps that follow-through from reporting on the discord.py-heavy side of
# the import graph this config does not scope to.
follow_imports = "silent"
# This codebase's existing style is `x: str = None` throughout; PEP 484's
# stricter default would report every one of them as a new class of error
# this pass was never meant to catch.
implicit_optional = true
