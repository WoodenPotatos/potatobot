name: CI

on:
  push:
  pull_request:
  # A push or pull_request scan only covers that event's commit range. These two
  # give the secret scan a periodic and an on-demand pass over the whole history,
  # where the accepted findings in .gitleaksignore apply.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Four tests drive dashboard/script.js through Node — the row editor's
      # round trip, `tr`'s guard, the managed creators' pack/unpack pair, and the
      # payload each creator submits. Without Node they call `skipTest` and pass,
      # so the checks guarding the defects that reached the deployment were the
      # ones CI never ran.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Test-only. The dashboard itself has no build step and no runtime
      # dependencies; jsdom exists so a test can actually boot the page, which
      # is the only thing that catches a throw during startup.
      - run: npm install --no-audit --no-fund
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m compileall -q . -x './\.git|./venv|./\.venv'
      # Scoped to core/ only -- see the comment on [tool.mypy] in
      # pyproject.toml for why cogs/ is out of scope for now.
      - run: python -m mypy
      - run: python -m unittest discover -s tests -v
      # Exits non-zero only on a key something references but no catalog has,
      # which is the one class of localization finding that is a defect rather
      # than a number to read. The rest of the report is informational.
      - run: python scripts/locale_audit.py --brief
      - run: python -m pip_audit -r requirements.lock
      - run: bandit -r . -c pyproject.toml --severity-level high

  # Nothing else in CI ever built this image, so the container path rotted
  # silently between the one time someone ran it by hand and the next: a
  # stale image tag, a missing dependency, a Containerfile step nobody
  # noticed break. This only builds -- it does not run the stack or push
  # anywhere -- but a build failure is still the majority of what actually
  # rotted here before.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f container/Containerfile -t potatobot:ci .

  # Separate from the Python matrix so the secret scan runs once rather than
  # three times, and so a Python failure cannot mask it or the reverse.
  secrets:
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one, so `contents` is
    # repeated rather than inherited. `pull-requests: read` is what the action
    # needs on a pull request: it asks the API for the commit range to scan
    # before it scans anything, so without it the job failed *before* the scan
    # and every pull request went unscanned. Read is not downgraded for a
    # dependency bot's pull request the way write is.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The action scans a commit range, so the base commit must exist
          # locally; a shallow clone breaks it. Full depth also lets the
          # scheduled run cover the whole history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so a new upstream rule cannot turn a green build red without
          # a deliberate change here. Verified locally against this version.
          GITLEAKS_VERSION: 8.30.1
          # Kept off alongside the read permission above. Commenting needs
          # `pull-requests: write`, which a dependency bot's pull request never
          # gets however a workflow declares it -- so leaving comments on would
          # reintroduce the same failure on exactly the pull requests that
          # found it. The exit code is the gate; the comment never was.
          GITLEAKS_ENABLE_COMMENTS: false
          # GITLEAKS_LICENSE is required only for organization accounts, and
          # this repository belongs to a user account.
          #
          # .gitleaks.toml and .gitleaksignore are discovered automatically from
          # the repository root; the action passes no --config of its own.
